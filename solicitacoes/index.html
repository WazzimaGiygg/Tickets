    <style>

            margin: 0;

        body {

        .container {

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.1);

            align-items: center;

        .header h1 {

        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;

        .user-name {

        }

        .user-email {

        .btn-logout {

        .stats-grid {

        .stat-card {

        .checkbox-group {

        .section-title {

            margin-bottom: 20px;

            align-items: center;
            gap: 10px;
        }

        .requests-table {
            overflow-x: auto;
        }

        table {
            width: 100%;

        }

        th {
            text-align: left;
            padding: 12px;
            background: #f7fafc;

            font-size: 13px;
        }

        td {
            padding: 12px;

        .status-badge {
            display: inline-block;
            padding: 4px 12px;

        }

        .status-pending { background: #fef3c7; color: #d97706; }
        .status-processing { background: #dbeafe; color: #2563eb; }
        .status-completed { background: #d1fae5; color: #059669; }

        .protocol-code {
            font-family: monospace;

        .empty-state {
            text-align: center;

        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            padding: 30px;
            text-align: center;
        }

        .modal-content .material-icons {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .modal-content .success-icon { color: #48bb78; }
        .modal-content .error-icon { color: #e53e3e; }

        .modal-content h3 { margin-bottom: 15px; color: #2d3748; }
        .modal-content p { color: #718096; margin-bottom: 20px; }

        .modal-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);

            border-radius: 50px;

        }

        .loading-spinner {
            display: inline-block;

            height: 20px;

            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;

            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            z-index: 1100;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }

        .login-container {
            max-width: 500px;
            margin: 100px auto;
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .login-container h2 {
            color: #2d3748;
            margin-bottom: 20px;
        }

        .login-container p {

        }

        .btn-google {

            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 16px;

        @media (max-width: 768px) {

</head>
<body>
    <div id="app"></div>

    <script>
        // ============================================
        // CONFIGURAÇÃO DO FIREBASE
        // ============================================
        
        const firebaseConfig = {
            apiKey: "AIzaSyB9GkSqTIZ0kbVsba_WOdQeVAETrF9qna0",
            authDomain: "wzzm-ce3fc.firebaseapp.com",
            projectId: "wzzm-ce3fc",
            storageBucket: "wzzm-ce3fc.appspot.com",
            messagingSenderId: "249427877153",
            appId: "1:249427877153:web:0e4297294794a5aadeb260"
        };

        // Inicializar Firebase
        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // Configuração do EmailJS
        const EMAILJS_CONFIG = {
            PUBLIC_KEY: 'KB_xBv3-83G8qMGlw',
            SERVICE_ID: 'service_wxt3tt9',
            TEMPLATE_ID: 'template_svo2mrf'
        };
        
        // Inicializar EmailJS se disponível
        if (typeof emailjs !== 'undefined') {
            emailjs.init(EMAILJS_CONFIG.PUBLIC_KEY);
        }

        // ============================================
        // VARIÁVEIS GLOBAIS
        // ============================================
        
        let currentUser = null;
        let userRequests = [];

        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        
        function showToast(message, isError) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = isError ? '#e53e3e' : '#48bb78';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 4000);
        }

        function formatDate(date) {
            if (!date) return 'N/A';
            if (date.toDate) date = date.toDate();
            return date.toLocaleDateString('pt-BR') + ' ' + date.toLocaleTimeString('pt-BR');
        }

        function getStatusBadge(status) {
            var statusMap = {
                'pending': { text: '⏳ Pendente', class: 'status-pending' },
                'processing': { text: '🔄 Processando', class: 'status-processing' },
                'completed': { text: '✅ Concluído', class: 'status-completed' },
                'rejected': { text: '❌ Rejeitado', class: 'status-rejected' }
            };
            var s = statusMap[status] || statusMap.pending;
            return '<span class="status-badge ' + s.class + '">' + s.text + '</span>';
        }

        function generateProtocol() {
            var date = new Date();
            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            var random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            return 'WZZM-LGPD-' + year + month + day + '-' + random;
        }

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // CARREGAR SOLICITAÇÕES DO USUÁRIO
        // ============================================
        
        async function loadUserRequests() {
            if (!currentUser) return;
            
            var tbody = document.getElementById('requests-tbody');
            if (tbody) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">📋 Carregando suas solicitações...</td></tr>';
            }
            
            try {
                var snapshot = await db.collection('deletion_requests')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('requestDate', 'desc')
                    .get();
                
                userRequests = [];
                snapshot.forEach(function(doc) {
                    var data = doc.data();
                    var requestDate = data.requestDate;
                    if (requestDate && requestDate.toDate) {
                        requestDate = requestDate.toDate();
                    } else if (!requestDate) {
                        requestDate = new Date();
                    }
                    userRequests.push({
                        id: doc.id,
                        protocol: data.protocol,
                        status: data.status,
                        reason: data.reason,
                        requestDate: requestDate,
                        completedAt: data.completedAt
                    });
                });
                
                updateStats();
                displayRequests();
                
            } catch (error) {
                console.error('Erro ao carregar solicitações:', error);
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">❌ Erro ao carregar: ' + error.message + '</td></tr>';
                }
            }
        }

        function updateStats() {
            var pending = 0, processing = 0, completed = 0, rejected = 0;
            
            for (var i = 0; i < userRequests.length; i++) {
                var status = userRequests[i].status;
                if (status === 'pending') pending++;
                else if (status === 'processing') processing++;
                else if (status === 'completed') completed++;
                else if (status === 'rejected') rejected++;
            }
            
            var statPending = document.getElementById('stat-pending');
            var statProcessing = document.getElementById('stat-processing');
            var statCompleted = document.getElementById('stat-completed');
            var statRejected = document.getElementById('stat-rejected');
            var statTotal = document.getElementById('stat-total');
            
            if (statPending) statPending.textContent = pending;
            if (statProcessing) statProcessing.textContent = processing;
            if (statCompleted) statCompleted.textContent = completed;
            if (statRejected) statRejected.textContent = rejected;
            if (statTotal) statTotal.textContent = userRequests.length;
        }

        function displayRequests() {
            var tbody = document.getElementById('requests-tbody');
            if (!tbody) return;
            
            if (userRequests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">📭 Nenhuma solicitação encontrada</td></tr>';
                return;
            }
            
            var html = '';
            for (var i = 0; i < userRequests.length; i++) {
                var req = userRequests[i];
                var protocolText = req.protocol ? req.protocol : req.id.substring(0, 12);
                var completedText = req.completedAt ? formatDate(req.completedAt) : '-';
                var reasonText = req.reason ? req.reason : '-';
                
                html += '<tr>' +
                    '<td><code class="protocol-code">' + escapeHtml(protocolText) + '</code></td>' +
                    '<td>' + formatDate(req.requestDate) + '</td>' +
                    '<td>' + getStatusBadge(req.status) + '</td>' +
                    '<td>' + escapeHtml(reasonText) + '</td>' +
                    '<td>' + completedText + '</td>' +
                '</tr>';
            }
            tbody.innerHTML = html;
        }

        // ============================================
        // SALVAR SOLICITAÇÃO
        // ============================================
        
        async function saveRequestToFirestore(requestData) {
            try {
                var docRef = await db.collection('deletion_requests').add({
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    userName: currentUser.displayName || currentUser.email.split('@')[0],
                    status: 'pending',
                    requestDate: firebase.firestore.FieldValue.serverTimestamp(),
                    source: 'user_dashboard',
                    protocol: requestData.protocol,
                    reason: requestData.reason,
                    comments: requestData.comments,
                    requestType: 'deletion'
                });
                return { success: true, id: docRef.id };
            } catch (error) {
                console.error('Erro no Firestore:', error);
                return { success: false, error: error.message };
            }
        }

        async function sendEmailNotification(requestData, protocol) {
            if (typeof emailjs === 'undefined') {
                console.log('EmailJS não disponível');
                return { success: false };
            }
            
            var templateParams = {
                to_email: 'dpo@wazzimagiygg.com',
                from_name: requestData.userName,
                from_email: currentUser.email,
                subject: '[LGPD] Solicitação de Exclusão de Dados - ' + protocol,
                protocol: protocol,
                request_type: 'Exclusão de Dados (LGPD Art. 18)',
                law: 'LGPD - Lei Geral de Proteção de Dados',
                message: 'Protocolo: ' + protocol + '\n' +
                         'Nome: ' + requestData.userName + '\n' +
                         'Email: ' + currentUser.email + '\n' +
                         'UID: ' + currentUser.uid + '\n' +
                         'Motivo: ' + (requestData.reason || 'Não informado') + '\n' +
                         'Observações: ' + (requestData.comments || 'Nenhuma') + '\n' +
                         'Data: ' + new Date().toLocaleString('pt-BR'),
                reply_to: currentUser.email,
                created_at: new Date().toLocaleString('pt-BR')
            };

            try {
                await emailjs.send(
                    EMAILJS_CONFIG.SERVICE_ID,
                    EMAILJS_CONFIG.TEMPLATE_ID,
                    templateParams
                );
                return { success: true };
            } catch (error) {
                console.error('Erro no EmailJS:', error);
                return { success: false };
            }
        }

        // ============================================
        // FORMULÁRIO
        // ============================================
        
        async function submitDeletionRequest(event) {
            event.preventDefault();
            
            var reasonSelect = document.getElementById('reason');
            var commentsText = document.getElementById('comments');
            var confirmCheckbox = document.getElementById('confirm-lgpd');
            
            var reason = reasonSelect ? reasonSelect.value : '';
            var comments = commentsText ? commentsText.value.trim() : '';
            var confirmLgpd = confirmCheckbox ? confirmCheckbox.checked : false;
            
            if (!confirmLgpd) {
                showToast('❌ Você precisa confirmar que é o titular dos dados', true);
                return;
            }
            
            var protocol = generateProtocol();
            var submitBtn = document.getElementById('submit-btn');
            
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="loading-spinner"></span> Enviando solicitação...';
            }
            
            var requestData = {
                reason: reason || null,
                comments: comments || null,
                protocol: protocol,
                userName: currentUser.displayName || currentUser.email.split('@')[0]
            };
            
            try {
                var result = await saveRequestToFirestore(requestData);
                
                if (!result.success) {
                    throw new Error(result.error);
                }
                
                await sendEmailNotification(requestData, protocol);
                
                showToast('✅ Solicitação enviada com sucesso!');
                
                if (reasonSelect) reasonSelect.value = '';
                if (commentsText) commentsText.value = '';
                if (confirmCheckbox) confirmCheckbox.checked = false;
                
                await loadUserRequests();
                
                var modal = document.getElementById('success-modal');
                var protocolSpan = document.getElementById('success-protocol');
                if (protocolSpan) protocolSpan.textContent = protocol;
                if (modal) modal.style.display = 'flex';
                
            } catch (error) {
                console.error('Erro:', error);
                showToast('❌ Erro ao enviar solicitação: ' + error.message, true);
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span class="material-icons">delete_forever</span> Solicitar Exclusão Permanente';
                }
            }
        }

        // ============================================
        // RENDERIZAÇÃO DA INTERFACE
        // ============================================
        
        function renderDashboard() {
            var app = document.getElementById('app');
            var userName = currentUser.displayName || currentUser.email.split('@')[0];
            var userInitial = userName.charAt(0).toUpperCase();
            
            app.innerHTML = `
                <div class="container">

                            <span class="material-icons">delete_forever</span>

                        <div class="user-info">

                            <div class="user-details">
                                <div class="user-name">${escapeHtml(userName)}</div>
                                <div class="user-email">${escapeHtml(currentUser.email)}</div>
                            </div>
                            <button class="btn-logout" onclick="window.signOut()">
                                <span class="material-icons" style="font-size: 16px;">logout</span> Sair
                            </button>

                    </div>

                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-number" id="stat-pending">0</div><div class="stat-label">Pendentes</div></div>
                        <div class="stat-card"><div class="stat-number" id="stat-processing">0</div><div class="stat-label">Processando</div></div>
                        <div class="stat-card"><div class="stat-number" id="stat-completed">0</div><div class="stat-label">Concluídos</div></div>
                        <div class="stat-card"><div class="stat-number" id="stat-rejected">0</div><div class="stat-label">Rejeitados</div></div>
                        <div class="stat-card"><div class="stat-number" id="stat-total">0</div><div class="stat-label">Total</div></div>
                    </div>

                    <div class="form-card">
                        <div class="form-title">
                            <span class="material-icons">assignment</span>
                            Nova Solicitação de Exclusão
                        </div>

                        <div class="warning-box">
                            <span class="material-icons">warning</span>
                            <p><strong>Atenção:</strong> A exclusão é irreversível! Todos os seus dados serão permanentemente removidos de nossos sistemas.</p>
                        </div>

                        <form id="deletion-form">
                            <div class="form-group">
                                <label>Motivo da Solicitação</label>
                                <select id="reason">
                                    <option value="">Selecione uma opção...</option>
                                    <option value="Nao utilizo mais a plataforma">Não utilizo mais a plataforma</option>
                                    <option value="Preocupacoes com privacidade">Preocupações com privacidade</option>
                                    <option value="Dados incorretos ou desatualizados">Dados incorretos ou desatualizados</option>
                                    <option value="Revogacao de consentimento">Revogação de consentimento</option>
                                    <option value="Outro motivo">Outro motivo</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Observações adicionais</label>
                                <textarea id="comments" placeholder="Informe qualquer detalhe relevante sobre sua solicitação..."></textarea>
                            </div>

                            <div class="checkbox-group">
                                <input type="checkbox" id="confirm-lgpd">
                                <label>
                                    Confirmo que sou o titular dos dados e estou ciente de que a exclusão é irreversível, conforme previsto no <strong>Art. 18 da LGPD</strong>.
                                </label>
                            </div>

                            <button type="submit" class="btn-submit" id="submit-btn">
                                <span class="material-icons">delete_forever</span>
                                Solicitar Exclusão Permanente
                            </button>
                        </form>
                    </div>

                    <div class="requests-section">
                        <div class="section-title">
                            <span class="material-icons">history</span>
                            Minhas Solicitações
                        </div>
                        <div class="requests-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Protocolo</th>
                                        <th>Data da Solicitação</th>
                                        <th>Status</th>
                                        <th>Motivo</th>
                                        <th>Conclusão</th>
                                    </tr>
                                </thead>
                                <tbody id="requests-tbody">
                                    <tr><td colspan="5" class="empty-state">📋 Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="success-modal" class="modal">
                    <div class="modal-content">
                        <span class="material-icons success-icon">check_circle</span>
                        <h3>Solicitação Enviada com Sucesso!</h3>
                        <p>Sua solicitação de exclusão de dados foi recebida pela nossa equipe de compliance.</p>
                        <div style="background:#f0f0f0; padding:10px; border-radius:8px; font-family:monospace; margin:15px 0;" id="success-protocol">WZZM-LGPD-XXXX</div>
                        <p><strong>Prazo de resposta: 15 dias úteis</strong></p>
                        <button class="modal-btn" onclick="window.closeModal()">OK, entendi</button>
                    </div>
                </div>
            `;
            
            var form = document.getElementById('deletion-form');
            if (form) {
                form.addEventListener('submit', submitDeletionRequest);
            }
            
            loadUserRequests();
        }

        function renderLogin() {
            var app = document.getElementById('app');
            app.innerHTML = `
                <div class="login-container">
                    <span class="material-icons" style="font-size: 64px; color: #667eea;">delete_forever</span>
                    <h2>Solicitar Exclusão de Dados - LGPD</h2>
                    <p>Para solicitar a exclusão dos seus dados, você precisa fazer login com sua conta Google.</p>
                    <p style="font-size: 12px; margin-top: 10px;">Seus dados serão tratados conforme a Lei 13.709/2018 (LGPD)</p>
                    <button class="btn-google" onclick="window.signIn()">
                        <span class="material-icons">login</span>
                        Entrar com Google
                    </button>
                </div>
            `;
        }

        // ============================================
        // FUNÇÕES GLOBAIS
        // ============================================
        
        window.signIn = function() {
            auth.signInWithPopup(googleProvider).catch(function(error) {
                console.error('Erro no login:', error);
                showToast('❌ Erro ao fazer login: ' + error.message, true);
            });
        };

        window.signOut = function() {
            auth.signOut().then(function() {
                showToast('✅ Logout realizado com sucesso');
                renderLogin();
            }).catch(function(error) {
                console.error('Erro no logout:', error);
            });
        };

        window.closeModal = function() {
            var modal = document.getElementById('success-modal');
            if (modal) modal.style.display = 'none';
        };

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        
        auth.onAuthStateChanged(function(user) {
            currentUser = user;
            if (user) {
                console.log('✅ Usuário logado:', user.email);
                renderDashboard();
            } else {
                console.log('❌ Nenhum usuário logado');
                renderLogin();
            }
        });
    </script>
</body>
</html>
